<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Cyborg KPI"/>
<meta name="theme-color" content="#1C1C1E"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Cyborg KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{--bg:#111113;--card:#1C1C1F;--card2:#232327;--card3:#2A2A2F;--rim:rgba(255,255,255,.06);--txt:#F2F2F7;--txt2:#ebebf5;--sub:#98989F;--sub2:#8E8E93;--brd:rgba(255,255,255,.08);--brd2:rgba(255,255,255,.05);--brd3:rgba(255,255,255,.06);--brd4:rgba(120,120,128,.22);--nav:rgba(17,17,19,.96);--inp:#232327;--blue:#3B82F6;--blue2:#60A5FA;--f-display:'Bebas Neue',sans-serif;--f-mono:'JetBrains Mono',monospace;--f-body:'DM Sans',-apple-system,sans-serif;--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
body.light{--bg:#F2F2F7;--card:#fff;--card2:#E5E5EA;--card3:#C7C7CC;--txt:#000;--txt2:#1C1C1E;--sub:#6C6C70;--sub2:#8E8E93;--brd:rgba(198,198,200,.8);--brd2:rgba(198,198,200,.4);--brd3:rgba(198,198,200,.6);--brd4:rgba(120,120,128,.15);--nav:rgba(242,242,247,.96);--inp:#E5E5EA;background-image:none}
body{background:var(--bg);background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:32px 32px;font-family:var(--f-body);color:var(--txt);overscroll-behavior:none;transition:background .2s,color .2s}
input,textarea,select{-webkit-user-select:auto;user-select:auto;font-family:inherit}
::-webkit-scrollbar{display:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.f-mono,.pg-sub,.sec,.nl{font-variant-numeric:tabular-nums}
select option{background:var(--card)}
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.hdr{padding:52px 20px 0;flex-shrink:0}
.back{background:none;border:none;color:#3B82F6;font-size:16px;padding:0 0 6px;cursor:pointer;display:block;font-family:inherit;transition:opacity 150ms var(--ease-out)}
@media(hover:hover) and (pointer:fine){.back:hover{opacity:.7}}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start}
.pg-sub{font-size:12px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin:0 0 2px;font-family:var(--f-mono)}
.pg-title{font-size:34px;font-weight:400;color:var(--txt);margin:0 0 4px;font-family:var(--f-display);letter-spacing:.5px;text-wrap:balance}
.add-btn{border:none;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;margin-top:4px;flex-shrink:0;font-family:inherit}
.content{flex:1;overflow-y:auto;padding:12px 16px 100px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--brd);display:flex;padding:8px 0 28px;z-index:100}
.nb{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 0;font-family:inherit}
.ni{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.nl{font-size:10px;font-weight:500;color:var(--sub)}
.card{background:var(--card);background-image:linear-gradient(to bottom,rgba(59,130,246,.1) 0px,rgba(59,130,246,0) 1px);border:1px solid var(--rim);border-radius:20px;padding:16px;margin-bottom:12px}
.card22{border-radius:22px;padding:18px}
.sec{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin:0 0 8px 2px;font-family:var(--f-mono)}
.lcard{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:12px}
.li{padding:14px 16px;border-bottom:.5px solid var(--brd);display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.li:last-child{border-bottom:none}
.li.dragging{opacity:.3}
.drag-handle{display:flex;flex-direction:column;gap:3px;flex-shrink:0;padding:2px 4px;opacity:.25}
.drag-handle span{display:block;width:14px;height:1.5px;background:var(--txt);border-radius:1px}
.chev{color:var(--card3);font-size:18px;flex-shrink:0}
.bar{background:var(--brd2);border-radius:3px;height:4px;overflow:hidden;margin-top:7px}
.barf{height:100%;border-radius:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--card);border:1px solid var(--rim);border-radius:20px;padding:16px;cursor:pointer}
.inp{width:100%;background:var(--inp);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;font-size:16px;color:var(--txt);outline:none;transition:border-color 150ms ease}
.inp:focus{border-color:rgba(59,130,246,.5)}
.sel{width:100%;background:var(--inp);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;font-size:16px;color:var(--txt);outline:none;appearance:none;-webkit-appearance:none;transition:border-color 150ms ease}
.sel:focus{border-color:rgba(59,130,246,.5)}
textarea.inp{resize:none;height:52px;font-size:14px}
.fld{margin-bottom:10px}
.lbl{font-size:12px;color:var(--sub);font-weight:500;margin:0 0 5px;display:flex;align-items:center;gap:5px}
.ibtn{width:15px;height:15px;border-radius:50%;border:1px solid var(--card3);background:none;color:var(--sub);font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;line-height:1;padding:14px;margin:-14px;box-sizing:content-box;transition:border-color 150ms ease,color 150ms ease}
@media(hover:hover) and (pointer:fine){.ibtn:hover{border-color:var(--sub2);color:var(--txt)}}
.sbtn{width:100%;border:none;border-radius:14px;padding:14px 0;font-size:16px;font-weight:600;color:#fff;cursor:pointer;margin-top:8px;font-family:inherit}
.tw{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.tt{width:46px;height:26px;border-radius:13px;padding:2px;cursor:pointer;flex-shrink:0;transition:background 150ms var(--ease-out)}
.th{width:22px;height:22px;border-radius:50%;background:#fff;transition:transform 150ms var(--ease-out)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;z-index:200}
.ms{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:430px;margin:0 auto;padding:8px 20px 44px;max-height:90dvh;overflow-y:auto;animation:sheetIn 280ms var(--ease-drawer) both}
.mh{width:36px;height:5px;background:var(--card3);border-radius:3px;margin:10px auto 16px}
.mcl{background:var(--card2);border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;color:var(--sub2);font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background 150ms ease,color 150ms ease}
@media(hover:hover) and (pointer:fine){.mcl:hover{background:var(--card3);color:var(--txt)}}
.qb{flex:1;border:none;border-radius:10px;padding:10px 0;font-size:14px;color:#fff;cursor:pointer;font-family:inherit}
.db{background:rgba(255,59,48,.15);border:none;border-radius:8px;padding:11px 10px;font-size:12px;color:#FF453A;cursor:pointer;font-family:inherit;flex-shrink:0;transition:background 150ms ease}
@media(hover:hover) and (pointer:fine){.db:hover{background:rgba(255,59,48,.25)}}
.mt{background:var(--card2);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--sub2);display:inline-block;margin:2px}
.nb2{background:var(--card2);border-radius:9px;padding:8px 12px}
.pbar{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:10px}
.pb{flex:1;border:none;border-radius:9px;padding:7px 0;font-size:13px;cursor:pointer;font-family:inherit;transition:background 150ms ease,color 150ms ease}
@media(hover:hover) and (pointer:fine){.pb:hover{background:var(--card2)}}
.tbar{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:10px}
.tb{flex:1;border:none;border-radius:9px;padding:8px 0;font-size:14px;cursor:pointer;font-family:inherit;transition:background 150ms ease,color 150ms ease}
@media(hover:hover) and (pointer:fine){.tb:hover{background:var(--card2)}}
.np{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.npb{background:none;border:none;font-size:22px;cursor:pointer;padding:0 6px;line-height:1;font-family:inherit;transition:opacity 150ms ease}
@media(hover:hover) and (pointer:fine){.npb:hover{opacity:.6}}
.sr{display:grid;grid-template-columns:1fr 80px 80px;padding:9px 12px;align-items:center;border-bottom:.5px solid var(--brd2)}
.sr:last-child{border-bottom:none}
.ec{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px}
.rw{position:relative;flex-shrink:0}
.rl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.zi{display:flex;gap:8px;align-items:center}
.zinp{flex:1;background:var(--card2);border:1.5px solid transparent;border-radius:9px;padding:8px 12px;font-size:16px;color:var(--txt);outline:none;font-family:inherit;transition:border-color 150ms ease}
.zinp:focus{border-color:rgba(59,130,246,.5)}
.zok{border:none;border-radius:9px;padding:8px 16px;font-size:14px;color:#fff;cursor:pointer;font-weight:600;font-family:inherit}
.zcl{background:var(--card2);border:none;border-radius:9px;padding:8px 12px;font-size:14px;color:var(--sub2);cursor:pointer;font-family:inherit}
.er{padding:14px 16px;border-bottom:.5px solid var(--brd);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background 100ms ease}
.er:last-child{border-bottom:none}
@media(hover:hover) and (pointer:fine){.er:hover{background:var(--card2)}}
.fw{display:flex;gap:8px;flex-wrap:wrap}
.fh{flex:1 1 calc(50% - 4px)}
.bkbanner{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:300;padding:12px 16px;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--brd);display:flex;align-items:center;gap:10px;animation:slideDown 250ms var(--ease-out) both}
@keyframes slideDown{from{transform:translateX(-50%) translateY(-100%)}to{transform:translateX(-50%) translateY(0)}}
.bkbanner-txt{flex:1;font-size:13px;color:var(--sub2)}
.bkbanner-btn{background:#3B82F6;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
.bkbanner-cl{background:none;border:none;color:var(--card3);font-size:20px;cursor:pointer;padding:0 2px;font-family:inherit;line-height:1}
.rsov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px}
.rsbox{background:var(--bg);border-radius:22px;padding:24px;width:100%;max-width:360px;text-align:center}
.infov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:32px}
.infobox{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:320px}
.infobox h3{font-size:17px;font-weight:700;color:var(--txt);margin:0 0 8px}
.infobox p{font-size:14px;color:var(--sub2);line-height:1.6;margin:0}
.infocl{width:100%;background:var(--card2);border:none;border-radius:12px;padding:11px 0;font-size:15px;color:var(--txt);cursor:pointer;margin-top:16px;font-family:inherit}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;background:var(--card2);border-radius:14px;box-shadow:0 12px 40px rgba(10,10,15,.75);padding:14px 16px;display:flex;align-items:center;gap:12px;width:calc(min(430px,100vw) - 32px);left:16px}
.pwov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;display:flex;align-items:center;justify-content:center;padding:32px}
.pwbox{background:var(--bg);border-radius:22px;padding:28px 24px;width:100%;max-width:340px;text-align:center}
.pw-inp{width:100%;background:var(--card);border:1.5px solid var(--card2);border-radius:12px;padding:14px 16px;font-size:20px;color:var(--txt);text-align:center;letter-spacing:6px;outline:none;font-family:inherit;margin-bottom:12px}
.pw-inp:focus{border-color:#5E5CE6}
.pe-tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:360px}
.pe-tbl th{text-align:right;padding:8px 5px;color:var(--sub);font-weight:600;font-size:10px;border-bottom:.5px solid var(--brd)}
.pe-tbl th:first-child{text-align:left}
.pe-tbl td{text-align:right;padding:8px 5px;border-bottom:.5px solid var(--brd2)}
.pe-tbl td:first-child{text-align:left;color:var(--sub2);white-space:nowrap}
.pe-tbl tr.note-row td{padding:1px 5px 7px;color:var(--card3);font-size:10px;font-style:italic}
.chart-tip{position:fixed;background:rgba(44,44,46,.97);backdrop-filter:blur(10px);border:.5px solid rgba(84,84,88,.5);border-radius:10px;padding:6px 12px;font-size:12px;color:#fff;pointer-events:none;z-index:999;white-space:nowrap;transform:translateX(-50%);transition:opacity .1s}
/* PR toast */
.pr-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FF9500,#FF6B00);color:#fff;border-radius:16px;padding:10px 20px;font-size:15px;font-weight:700;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(255,149,0,.4);animation:fadeUp 280ms var(--ease-out) both}
/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ringFade{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes undoIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.anim{animation:cardIn 300ms var(--ease-out) both}
.anim-d1{animation-delay:.04s}
.anim-d2{animation-delay:.08s}
.anim-d3{animation-delay:.12s}
.anim-d4{animation-delay:.16s}
.anim-d5{animation-delay:.16s}
.anim-d6{animation-delay:.16s}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.sbtn{transition:transform 120ms var(--ease-out)}
.sbtn:active{transform:scale(0.97)}
@media(hover:hover) and (pointer:fine){.sc:hover{transform:scale(1.01);transition:transform 150ms var(--ease-out)}}
.sc{transition:transform 120ms var(--ease-out)}
.sc:active{transform:scale(0.97)}
.nb{transition:transform 120ms var(--ease-out)}
.nb:active{transform:scale(0.94)}
.qb{transition:transform 120ms var(--ease-out)}
.qb:active{transform:scale(0.96)}
.li{transition:background 100ms ease}
.li:active{background:var(--card2)}
.er:active{background:var(--card2)}
@media(prefers-reduced-motion:reduce){
  .anim,.anim-d1,.anim-d2,.anim-d3,.anim-d4,.anim-d5,.anim-d6{animation:fadeIn .15s ease both}
  .ms,.bkbanner,.pr-toast{animation:fadeIn .15s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sbtn:active,.sc:active,.nb:active,.qb:active{transform:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="bkbanner" style="display:none" class="bkbanner">
  <span style="font-size:18px">☁️</span>
  <span class="bkbanner-txt">Neuer Eintrag – jetzt in iCloud sichern?</span>
  <button class="bkbanner-btn" id="bkdo">Backup</button>
  <button class="bkbanner-cl" id="bkcl">×</button>
</div>
<input type="file" id="fi" accept=".json" style="display:none"/>
<script>
(function(){
'use strict';

const COL={kraft:'#EF4444',engine:'#22C55E',peak:'#F97316',skills:'#A855F7',struktur:'#3B82F6',recovery:'#06B6D4'};
const SEC_COL={bpsfl:'#5E5CE6',bpel:'#0A84FF',nbel:'#32ADE6',mseg:'#34C759',beg:'#30D158'};
const SM=[{id:'kraft',label:'Kraft',desc:'Relative Strength'},{id:'engine',label:'Engine',desc:'Aerobe Kapazität'},{id:'peak',label:'Peak',desc:'Intervalle'},{id:'skills',label:'Skills',desc:'Nervensystem'},{id:'struktur',label:'Struktur',desc:'Robustheit'},{id:'recovery',label:'Recovery',desc:'Systemstatus'}];
const KPIS={
  kraft:[{k:'pullups',label:'Pull-ups',unit:'Reps',target:10,hb:1},{k:'pikeHSPU',label:'Pike / HSPU',unit:'Reps',target:10,hb:1},{k:'atgL',label:'ATG Split L',unit:'kg',hb:1},{k:'atgR',label:'ATG Split R',unit:'kg',hb:1},{k:'revNordic',label:'Reverse Nordic',unit:'Reps',target:5,hb:1},{k:'nordicCurl',label:'Nordic Curl',unit:'Reps',target:5,hb:1},{k:'dips',label:'Dips Max',unit:'Reps',target:20,hb:1},{k:'weightedDips',label:'Weighted Dips',unit:'kg',hb:1},{k:'pushupsMax',label:'Push-ups Max',unit:'Reps',target:30,hb:1},{k:'australianRows',label:'Australian Rows',unit:'Reps',target:15,hb:1},{k:'archerRows',label:'Archer Rows',unit:'Reps',hb:1},{k:'hbh',label:'Hollow Body Hold',unit:'s',target:30,hb:1},{k:'chestToBar',label:'Chest-to-Bar',unit:'Reps',target:5,hb:1},{k:'oneArmHang',label:'One-Arm Hang',unit:'s',target:10,hb:1}],
  engine:[{k:'pace',label:'Ø Pace',unit:'min/km',target:5.5,hb:0},{k:'hr',label:'Ø Puls',unit:'bpm',target:140,hb:0},{k:'drift',label:'HF-Drift',unit:'%',target:5,hb:0},{k:'rpe',label:'RPE',unit:'/10',target:6,hb:0},{k:'distanz',label:'Distanz',unit:'km',hb:1},{k:'kadenz',label:'Kadenz',unit:'spm',target:180,hb:1}],
  peak:[{k:'wattAvg',label:'Ø Watt',unit:'W',hb:1},{k:'wattMax',label:'Max Watt',unit:'W',hb:1},{k:'rpe',label:'RPE',unit:'/10',target:8,hb:0},{k:'dauer',label:'Dauer',unit:'min',hb:1}],
  skills:[
    // ── Bestehende Skills (Keys unveränderlich – keine Datenverlust) ──
    {k:'L-Sit',label:'L-Sit',unit:'s',target:60,hb:1},{k:'Handstand',label:'Handstand',unit:'s',target:30,hb:1},{k:'Frog Stand',label:'Frog Stand',unit:'s',target:60,hb:1},{k:'Pistol Squat L',label:'Pistol Squat L',unit:'Reps',target:5,hb:1},{k:'Pistol Squat R',label:'Pistol Squat R',unit:'Reps',target:5,hb:1},{k:'Muscle-up',label:'Muscle-up',unit:'Reps',target:5,hb:1},{k:'Front Lever',label:'Front Lever',unit:'s',target:10,hb:1},{k:'Back Lever',label:'Back Lever',unit:'s',target:30,hb:1},{k:'Dragon Flag',label:'Dragon Flag',unit:'Reps',target:10,hb:1},{k:'V-Sit',label:'V-Sit',unit:'s',target:30,hb:1},{k:'Planche Hold',label:'Planche Hold',unit:'s',target:10,hb:1},{k:'False Grip',label:'False Grip',unit:'s',target:30,hb:1},
    // ── Tier 1: Core Foundation ──
    {k:'hangingKneeRaise',label:'Hanging Knee Raise',unit:'Reps',target:15,hb:1},
    {k:'hangingLegRaise',label:'Hanging Leg Raise',unit:'Reps',target:15,hb:1},
    {k:'toeToBar',label:'Toes to Bar',unit:'Reps',target:10,hb:1},
    {k:'compressionHold',label:'Pike Compression Hold',unit:'s',target:30,hb:1},
    {k:'tuckLSit',label:'Tuck L-Sit',unit:'s',target:30,hb:1},
    // ── Push Tree ──
    {k:'pikePushUp',label:'Pike Push-Up',unit:'Reps',target:15,hb:1},
    {k:'pseudoPlanchePU',label:'Pseudo Planche PU',unit:'Reps',target:10,hb:1},
    {k:'elevatedPikePU',label:'Elevated Pike PU',unit:'Reps',target:10,hb:1},
    {k:'wallHandstand',label:'Wall Handstand Hold',unit:'s',target:60,hb:1},
    {k:'chestWallHS',label:'Chest-to-Wall HS',unit:'s',target:60,hb:1},
    {k:'wallHSPU',label:'Wall HSPU',unit:'Reps',target:5,hb:1},
    {k:'hspu',label:'Freestanding HSPU',unit:'Reps',target:3,hb:1},
    {k:'archerPushUp',label:'Archer Push-Up',unit:'Reps',target:5,hb:1},
    {k:'plancheLean',label:'Planche Lean',unit:'s',target:30,hb:1},

function checkPR(sysId,kpiK,newVal){

  var kpiDef=KPIS[sysId]&&KPIS[sysId].find(function(k){return k.k===kpiK;});
  if(!kpiDef)return false;
  var vals=existing.map(function(e){return e.value;});
  return kpiDef.hb?newVal>Math.max.apply(null,vals):newVal<Math.min.apply(null,vals);
}

function getWeek(off){var base=new Date(),dow=base.getDay()||7,mon=new Date(base);mon.setDate(base.getDate()-dow+1+off*7);var sun=new Date(mon);sun.setDate(mon.getDate()+6);var f=function(d){return d.getDate().toString().padStart(2,'0')+'.'+(d.getMonth()+1).toString().padStart(2,'0');};return{start:mon.toISOString().split('T')[0],end:sun.toISOString().split('T')[0],label:f(mon)+' – '+f(sun)};}

function getKPIs(sysId){var kpis=KPIS[sysId]||[];var ord=S.kpiOrder[sysId];if(!ord||!ord.length)return kpis;return ord.map(function(k){return kpis.find(function(kpi){return kpi.k===k;});}).filter(Boolean).concat(kpis.filter(function(kpi){return!ord.includes(kpi.k);}));}
function getEnts(sysId,kpiK,logs){var ents=logs[sysId]||[];var res=[];if(sysId==='kraft')res=ents.filter(function(e){return e.exercise===kpiK;}).map(function(e){var m={Technik:(e.technik||'–')+'/5',Schmerz:(e.pain||0)+'/10'};var val=e.value;if(kpiK==='weightedDips'&&e.wdReps>0){val=e.wdReps;m['Gewicht']=e.value+'kg';}else if(e.wdReps>0)m['Reps']=e.wdReps;if(e.atgReps>0)m['Reps']=e.atgReps;return{id:e.id,date:e.date,value:val,meta:m,notizen:e.notizen||''};});else if(sysId==='skills')res=ents.filter(function(e){return e.skill===kpiK;}).map(function(e){return{id:e.id,date:e.date,value:e.ist,meta:{Qualität:e.qualitaet,Abbruch:e.abbruch||'–'},notizen:e.notizen||''};});else res=ents.filter(function(e){return e[kpiK]!=null&&!isNaN(+e[kpiK]);}).map(function(e){return{id:e.id,date:e.date,value:parseFloat(e[kpiK]),meta:sysId==='engine'&&kpiK==='pace'?Object.assign({Nase:e.nase?'Ja':'Nein'},e.lauftyp?{Typ:e.lauftyp}:{},e.distanz?{Distanz:e.distanz+'km'}:{}):sysId==='engine'&&kpiK==='distanz'&&e.lauftyp?{Typ:e.lauftyp}:{},notizen:e.notizen||''};});return res.sort(function(a,b){return a.date.localeCompare(b.date);});}
function prog(val,kpi,targets,sysId){var t=targets[sysId+'.'+kpi.k]!=null?targets[sysId+'.'+kpi.k]:kpi.target;if(!t||val==null)return null;return kpi.hb?Math.min(val/t,1):val<=t?1:Math.max(0,2-val/t);}
function sysSc(sysId,logs,targets){var ps=(KPIS[sysId]||[]).map(function(kpi){var e=getEnts(sysId,kpi.k,logs);return e.length?prog(e[e.length-1].value,kpi,targets,sysId):null;}).filter(function(p){return p!=null;});return ps.length?ps.reduce(function(a,b){return a+b;},0)/ps.length:0;}

  if(mn===mx){mn-=1;mx+=1;}
  var rng=mx-mn,cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var pxf=function(i){return pad.l+(i/(data.length-1))*cw;};

  var encodedPts=encodeURIComponent(JSON.stringify(ptsData));

  function fmtY(v){return v>=1000?(v/1000).toFixed(1)+'k':v%1===0?String(v):v.toFixed(1);}
  var yMidV=(mn+mx)/2;

    '<line x1="'+pad.l+'" y1="'+(pad.t+ch/2).toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+ch/2).toFixed(1)+'" stroke="rgba(84,84,88,.1)" stroke-width=".5" stroke-dasharray="2,3" pointer-events="none"/>'+
    '<line x1="'+pad.l+'" y1="'+(H-pad.b)+'" x2="'+(W-pad.r)+'" y2="'+(H-pad.b)+'" stroke="rgba(84,84,88,.18)" stroke-width=".5" pointer-events="none"/>';
  var yLabels='<text x="'+(pad.l-4)+'" y="'+(pad.t+4)+'" font-size="9" fill="#48484A" text-anchor="end" font-family="JetBrains Mono,monospace" pointer-events="none">'+fmtY(mx)+'</text>'+

// ── Drag sort ───────────────────────────────────────────────────
function setupDragSort(sysId){
  var list=document.querySelector('#kpi-list');if(!list)return;
  var dragEl=null,ghost=null,timer=null,dragging=false,curOrder=null,startY=0;
  function items(){return Array.from(list.querySelectorAll('.li'));}
  function mkGhost(item){var r=item.getBoundingClientRect();var g=document.createElement('div');g.className='drag-ghost';g.style.top=r.top+'px';g.innerHTML=item.innerHTML;document.body.appendChild(g);return g;}
  function atY(y){return items().find(function(el){if(el===dragEl)return false;var r=el.getBoundingClientRect();return y>=r.top&&y<=r.bottom;});}
  list.addEventListener('touchstart',function(e){var item=e.target.closest('.li');if(!item)return;startY=e.touches[0].clientY;timer=setTimeout(function(){dragging=true;dragEl=item;curOrder=getKPIs(sysId).map(function(k){return k.k;});haptic('medium');item.classList.add('dragging');ghost=mkGhost(item);},450);},{passive:true});
  list.addEventListener('touchmove',function(e){if(!dragging||!ghost)return;e.preventDefault();var y=e.touches[0].clientY,dy=y-startY;startY=y;ghost.style.top=(parseFloat(ghost.style.top)+dy)+'px';var tgt=atY(y);if(tgt){var ti=curOrder.indexOf(tgt.dataset.kpiKey),di=curOrder.indexOf(dragEl.dataset.kpiKey);if(ti!==-1&&di!==-1&&ti!==di){curOrder.splice(di,1);curOrder.splice(ti,0,dragEl.dataset.kpiKey);if(di<ti)list.insertBefore(dragEl,tgt.nextSibling);else list.insertBefore(dragEl,tgt);}}}  ,{passive:false});
  function end(){clearTimeout(timer);if(ghost){ghost.remove();ghost=null;}if(dragEl){dragEl.classList.remove('dragging');dragEl=null;}if(dragging&&curOrder){S.kpiOrder[sysId]=curOrder;lsSave();dragging=false;curOrder=null;}}
  list.addEventListener('touchend',end);list.addEventListener('touchcancel',end);
}

// ── Chart scrub ─────────────────────────────────────────────────
function setupChartScrub(){
  var tip=document.createElement('div');
  tip.id='chart-tooltip';
  tip.style.cssText='position:fixed;background:rgba(44,44,46,.97);backdrop-filter:blur(10px);border:.5px solid rgba(84,84,88,.5);border-radius:10px;padding:6px 12px;font-size:12px;color:#fff;pointer-events:none;z-index:999;white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .1s;display:none';
  document.body.appendChild(tip);
  var active=null,hideTimer=null;
  function getNearest(el,touchX){var svg=document.getElementById(el.dataset.cid);if(!svg)return null;var pts=JSON.parse(decodeURIComponent(el.dataset.pts));var rect=svg.getBoundingClientRect();var scale=parseFloat(el.dataset.w)/rect.width;var relX=(touchX-rect.left)*scale;return pts.reduce(function(best,p){return Math.abs(p.x-relX)<Math.abs(best.x-relX)?p:best;},pts[0]);}
  function showScrub(el,touch){var nearest=getNearest(el,touch.clientX);if(!nearest)return;var svg=document.getElementById(el.dataset.cid);var rect=svg.getBoundingClientRect();var scale=rect.width/parseFloat(el.dataset.w);var cl=document.getElementById(el.dataset.cid+'-cl');var cd=document.getElementById(el.dataset.cid+'-cd');if(cl){cl.setAttribute('x1',nearest.x);cl.setAttribute('x2',nearest.x);cl.setAttribute('opacity','0.5');}if(cd){cd.setAttribute('cx',nearest.x);cd.setAttribute('cy',nearest.y);cd.setAttribute('opacity','1');}var tipX=rect.left+nearest.x*scale;var tipY=rect.top+nearest.y*scale;tip.innerHTML='<span style="color:#8E8E93;margin-right:6px">'+nearest.d+'</span><span style="font-weight:700">'+nearest.v+'</span>';tip.style.left=tipX+'px';tip.style.top=Math.max(8,tipY-44)+'px';tip.style.display='block';requestAnimationFrame(function(){tip.style.opacity='1';});}
  function hideScrub(){if(active){var cl=document.getElementById(active.dataset.cid+'-cl');var cd=document.getElementById(active.dataset.cid+'-cd');if(cl)cl.setAttribute('opacity','0');if(cd)cd.setAttribute('opacity','0');}tip.style.opacity='0';setTimeout(function(){tip.style.display='none';},150);active=null;}
  document.addEventListener('touchstart',function(e){var el=e.target.closest('[data-a="chart-scrub"]');if(!el)return;if(hideTimer)clearTimeout(hideTimer);active=el;showScrub(el,e.touches[0]);},{passive:true});
  document.addEventListener('touchmove',function(e){if(!active)return;showScrub(active,e.touches[0]);},{passive:true});
  document.addEventListener('touchend',function(){if(!active)return;hideTimer=setTimeout(hideScrub,1200);},{passive:true});

// ── Weekly Challenge ────────────────────────────────────────────
function getWeekChallenge(){
  var today=new Date(),dow=today.getDay(),diffMon=dow===0?6:dow-1;
  var mon=new Date(today);mon.setDate(today.getDate()-diffMon);
  var sun=new Date(mon);sun.setDate(mon.getDate()+6);
  var monStr=mon.toISOString().slice(0,10),sunStr=sun.toISOString().slice(0,10);
  var trainSys=SM.filter(function(s){return s.id!=='recovery';});
  var worst=trainSys.reduce(function(w,s){var sc=sysSc(s.id,S.logs,S.targets);return sc<w.sc?{id:s.id,sc:sc,label:s.label}:w;},{id:trainSys[0].id,sc:sysSc(trainSys[0].id,S.logs,S.targets),label:trainSys[0].label});
  var tgt=worst.id==='peak'?2:3;
  var weekEnts=(S.logs[worst.id]||[]).filter(function(e){return e.date>=monStr&&e.date<=sunStr;});
  var days=weekEnts.reduce(function(acc,e){if(acc.indexOf(e.date)===-1)acc.push(e.date);return acc;},[]).length;
  var cur=Math.min(days,tgt);
  return{sys:worst.id,label:worst.label,target:tgt,current:cur,done:cur>=tgt,endDate:sunStr,pct:Math.round(cur/tgt*100)};
}

// ── Adaptive Recommendation ─────────────────────────────────────
function getRecCtx(){
  var today=todayISO();
  function daysSince(sysId){var ents=(S.logs[sysId]||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});if(!ents.length)return 99;return Math.floor((new Date(today)-new Date(ents[0].date))/86400000);}
  var recEnts=(S.logs.recovery||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var latRec=recEnts[0];
  var stress=latRec?(latRec.stress||0):0;
  var muskelkater=latRec?(latRec.muskelkater||0):0;
  var unlockProgress=0;
  SKILL_CHAINS.forEach(function(ch){ch.nodes.forEach(function(nd){var kd=KPIS.skills.find(function(x){return x.k===nd.k;});if(!kd)return;var e=getEnts('skills',nd.k,S.logs);if(!e.length)return;var p=Math.min(prog(e[e.length-1].value,kd,S.targets,'skills')||0,1);if(p>unlockProgress&&p<1)unlockProgress=p;});});
  return{stress:stress,muskelkater:muskelkater,daysSinceKraft:daysSince('kraft'),daysSinceEngine:daysSince('engine'),daysSinceSkills:daysSince('skills'),unlockProgress:unlockProgress};
}
function getRecommendation(ctx){
  var readiness;
  if(ctx.stress>7||ctx.muskelkater>6)readiness='erholen';
  else if(ctx.stress>4||ctx.muskelkater>4)readiness='moderat';
  else readiness='bereit';
  var type,text,detail;
  if(readiness==='erholen'){
    type='recovery';text='Active Recovery';detail='Stress '+ctx.stress+'/10 · Muskelkater '+ctx.muskelkater+'/10';
  }else if(readiness==='moderat'){
    if(ctx.daysSinceSkills>3){type='skills';text='Skills Training';detail='Leicht · '+(ctx.daysSinceSkills<99?ctx.daysSinceSkills+'d Pause':'Erster Eintrag');}
    else if(ctx.daysSinceEngine>2){type='engine';text='Zone 2 Lauf';detail='Leicht · '+(ctx.daysSinceEngine<99?ctx.daysSinceEngine+'d Pause':'Erster Eintrag');}
    else{type='recovery';text='Mobility + Recovery';detail='Leichter Tag · Aktive Erholung';}
  }else{
    if(ctx.unlockProgress>0.8){type='skills';text='Skills · Unlock nah!';detail=Math.round(ctx.unlockProgress*100)+'% – Fast bereit';}
    else if(ctx.daysSinceKraft>3){type='kraft';text='Kraft-Training';detail=(ctx.daysSinceKraft<99?ctx.daysSinceKraft+'d Pause · Bereit für PR':'Erster Eintrag');}
    else if(ctx.daysSinceEngine>3){type='engine';text='Zone 2 Lauf';detail=(ctx.daysSinceEngine<99?ctx.daysSinceEngine+'d Pause · Aerobe Basis':'Erster Eintrag');}
    else if(ctx.daysSinceKraft>=ctx.daysSinceEngine){type='kraft';text='Kraft-Training';detail=(ctx.daysSinceKraft<99?ctx.daysSinceKraft+'d Pause':'Kein Eintrag');}
    else{type='engine';text='Zone 2 Lauf';detail=(ctx.daysSinceEngine<99?ctx.daysSinceEngine+'d Pause':'Kein Eintrag');}
  }
  return{type:type,text:text,detail:detail,readiness:readiness};
}

function getSkillBlockers(){
  function sp(k){var kd=KPIS.skills.find(function(x){return x.k===k;});if(!kd)return 0;var e=getEnts('skills',k,S.logs);if(!e.length)return 0;return Math.min(prog(e[e.length-1].value,kd,S.targets,'skills')||0,1);}
  function crThreshold(cr){var crKd=KPIS[cr.sys]&&KPIS[cr.sys].find(function(x){return x.k===cr.kpi;});return Math.max(cr.minVal,S.targets[cr.sys+'.'+cr.kpi]!=null?S.targets[cr.sys+'.'+cr.kpi]:(crKd&&crKd.target)||cr.minVal);}
  var seen={},res=[];
  SKILL_CHAINS.forEach(function(ch){
    ch.nodes.forEach(function(nd){
      if(seen[nd.k])return;
      var kd=KPIS.skills.find(function(x){return x.k===nd.k;});
      if(!kd)return;
      if(sp(nd.k)>=1)return;
      var blocker=null;
      if(nd.req&&sp(nd.req)<(nd.reqMin||0)){
        var reqKd=KPIS.skills.find(function(x){return x.k===nd.req;});
        var reqP=sp(nd.req),needed=nd.reqMin||0;
        blocker={skillLabel:kd.label,label:reqKd?reqKd.label:nd.req,sys:'Skills',color:COL.skills,current:Math.round(reqP*100),needed:Math.round(needed*100),unit:'%',progress:needed>0?reqP/needed:0};
      }else if(nd.crossReq){
        var t=crThreshold(nd.crossReq);
        var ce=getEnts(nd.crossReq.sys,nd.crossReq.kpi,S.logs);
        var cur=ce.length?Math.max.apply(null,ce.map(function(e){return e.value;})):0;
        if(cur<t){
          var crKd=KPIS[nd.crossReq.sys]&&KPIS[nd.crossReq.sys].find(function(x){return x.k===nd.crossReq.kpi;});
          var sysDef=SM.find(function(s){return s.id===nd.crossReq.sys;});
          blocker={skillLabel:kd.label,label:crKd?crKd.label:nd.crossReq.kpi,sys:sysDef?sysDef.label:nd.crossReq.sys,color:COL[nd.crossReq.sys]||COL.skills,current:cur,needed:t,unit:crKd?crKd.unit:'',progress:t>0?Math.min(cur/t,1):0};
        }
      }
      if(blocker){seen[nd.k]=true;res.push(blocker);}
    });
  });
  return res.sort(function(a,b){return b.progress-a.progress;});
}

function fPeak(col){return fld('Datum','<input class="inp" type="date" data-fk="date" value="'+todayISO()+'"/>')+fld('Protokoll (z.B. 4×4, Tabata)','<input class="inp" type="text" data-fk="protokoll" placeholder="z.B. 4×4 min Zone 4"/>')+'<div class="fw">'+fld('Dauer (min)',ni('dauer','20'),true)+fldI('RPE (1–10)','rpe',ni('rpe','8'),true)+'</div>'+'<div class="fw">'+fld('Ø Watt (optional)',ni('wattAvg',''),true)+fld('Max Watt (optional)',ni('wattMax',''),true)+'</div>'+fld('Notizen','<textarea class="inp" data-fk="notizen" placeholder="..."></textarea>')+sbtn('save-peak',col);}
function fSkills(col){
  // ── Schritt 1: Kette wählen ──────────────────────────────────────
  if(!S.fChain){
    function cpct(ch){var s=ch.nodes.reduce(function(acc,nd){var kd=KPIS.skills.find(function(x){return x.k===nd.k;});if(!kd)return acc;var e=getEnts('skills',nd.k,S.logs);var p=e.length?Math.min(prog(e[e.length-1].value,kd,S.targets,'skills')||0,1):0;return acc+p;},0);return Math.round(s/Math.max(ch.nodes.length,1)*100);}
    var h='<p style="font-size:13px;color:var(--sub2);margin:0 0 14px">Welche Progressionskette?</p>';
    var t1=SKILL_CHAINS.filter(function(c){return c.tier===1;});
    var t2=SKILL_CHAINS.filter(function(c){return c.tier===2;});
    h+='<p style="font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin:0 0 8px;font-family:var(--f-mono)">Tier 1 · Fundament</p>';
    t1.forEach(function(ch){
      var pct=cpct(ch);
      h+='<button style="width:100%;background:var(--card2);border:none;border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center" data-a="set-fchain" data-chain="'+ch.id+'">'+
        '<span style="font-size:14px;font-weight:500;color:var(--txt)">'+escHtml(ch.name)+'</span>'+
        '<span style="font-size:12px;color:'+col+';font-weight:700;font-family:var(--f-mono)">'+pct+'%</span>'+
        '</button>';
    });
    h+='<p style="font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin:12px 0 8px;font-family:var(--f-mono)">Tier 2 · Stärke</p>';
    var cats=['PUSH','PULL','CORE','LEGS','BALANCE'];
    cats.forEach(function(cat){
      var chs=t2.filter(function(c){return c.cat===cat;});
      if(!chs.length)return;
      h+='<p style="font-size:9px;color:var(--sub2);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:6px 0 4px;font-family:var(--f-mono)">'+cat+'</p>';
      chs.forEach(function(ch){
        var pct=cpct(ch);
        h+='<button style="width:100%;background:var(--card2);border:none;border-radius:12px;padding:12px 14px;margin-bottom:6px;text-align:left;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center" data-a="set-fchain" data-chain="'+ch.id+'">'+
          '<span style="font-size:14px;font-weight:500;color:var(--txt)">'+escHtml(ch.name)+'</span>'+
          '<span style="font-size:12px;color:'+(pct>0?col:'var(--sub)')+';font-weight:700;font-family:var(--f-mono)">'+(pct>0?pct+'%':'›')+'</span>'+
          '</button>';
      });
    });
    return h;
  }
  // ── Schritt 2: Skill + Wert eingeben ────────────────────────────
  var chain=SKILL_CHAINS.find(function(c){return c.id===S.fChain;});
  var chainKeys=chain?chain.nodes.map(function(nd){return nd.k;}):[KPIS.skills[0].k];
  var chainSkills=KPIS.skills.filter(function(o){return chainKeys.indexOf(o.k)!==-1;});
  chainSkills.sort(function(a,b){return chainKeys.indexOf(a.k)-chainKeys.indexOf(b.k);});
  var opts=chainSkills.map(function(o){return[o.k,o.label];});
  var kd=chainSkills.find(function(o){return o.k===S.fSkill;})||chainSkills[0]||KPIS.skills[0];
  var imap={'Front Lever':'frontlever','Back Lever':'backlever','Dragon Flag':'dragonflag','V-Sit':'vsit','Planche Hold':'planche'};
  var ik=imap[kd.k];
  return '<button style="background:none;border:none;color:'+col+';font-size:13px;font-weight:600;cursor:pointer;padding:0 0 12px;font-family:inherit;display:flex;align-items:center;gap:3px" data-a="clear-fchain">‹ '+escHtml(chain?chain.name:'Zurück')+'</button>'+
    fld('Datum','<input class="inp" type="date" data-fk="date" value="'+todayISO()+'"/>')+
    fld('Skill',selEl('fSkill',opts,kd.k))+
    '<div class="fld"><label class="lbl">'+escHtml(kd.label)+' ('+kd.unit+') — Ziel: '+kd.target+(ik?' '+ib(ik):'')+'</label>'+ni('ist','0')+'</div>'+
    fld('Qualität','<div style="display:flex;gap:8px">'+['ruhig','shaky'].map(function(q){return '<button class="qb" style="background:'+(S.fQual===q?col:'var(--card2)')+';font-weight:'+(S.fQual===q?600:400)+'" data-a="set-qual" data-qual="'+q+'">'+q+'</button>';}).join('')+'</div>')+
    fld('Abbruchgrund',ni('abbruch','z.B. Erschöpfung','text'))+
    fld('Notizen','<textarea class="inp" data-fk="notizen" placeholder="..."></textarea>')+
    sbtn('save-skills',col);
}

function addEntry(sysId,entry){
  // Check PR before adding
  var kpiK=sysId==='kraft'?entry.exercise:sysId==='skills'?entry.skill:null;
  var newVal=sysId==='kraft'?entry.value:sysId==='skills'?entry.ist:null;
  var isPR=false;
  if(kpiK&&newVal!=null){isPR=checkPR(sysId,kpiK,newVal);}
  else if(sysId!=='kraft'&&sysId!=='skills'){
    // for engine/peak/struktur/recovery, check each metric
  }
  if(!S.logs[sysId])S.logs[sysId]=[];
  S.logs[sysId].push(Object.assign({},entry,{id:uid()}));
  lsSave();S.modal=null;
  S.lastEntry={sysId:sysId,id:S.logs[sysId][S.logs[sysId].length-1].id};
  if(undoTimer)clearTimeout(undoTimer);
  undoTimer=setTimeout(function(){S.lastEntry=null;render();},4000);
  haptic('light');
  render();
  setTimeout(showBanner,400);

  if(isPR){
    var kpiDef=KPIS[sysId]&&KPIS[sysId].find(function(k){return k.k===kpiK;});
    setTimeout(function(){haptic('pr');showPRToast(kpiDef?kpiDef.label:kpiK);},500);
  }
}
function delEntry(sysId,eid){if(!S.logs[sysId])return;S.logs[sysId]=S.logs[sysId].filter(function(e){return e.id!==eid;});lsSave();render();}

function setupFileImport(cb){

if(S.logs.struktur)S.logs.struktur=S.logs.struktur.map(function(e){return typeof e.mobility==='boolean'?Object.assign({},e,{mobility:e.mobility?1:0}):e;});
// E-4: add lauftyp:'zone2' to old engine entries
if(S.logs.engine)S.logs.engine=S.logs.engine.map(function(e){return e.lauftyp?e:Object.assign({},e,{lauftyp:'zone2'});});
// K-6: Migrate Pistol Squat from Kraft → Skills
if(S.logs.kraft){var pistolEnts=S.logs.kraft.filter(function(e){return e.exercise==='pistolL'||e.exercise==='pistolR';});if(pistolEnts.length){if(!S.logs.skills)S.logs.skills=[];pistolEnts.forEach(function(e){S.logs.skills.push({id:uid(),date:e.date,skill:e.exercise==='pistolL'?'Pistol Squat L':'Pistol Squat R',ist:e.value,qualitaet:'ruhig',abbruch:'',notizen:e.notizen||''});});S.logs.kraft=S.logs.kraft.filter(function(e){return e.exercise!=='pistolL'&&e.exercise!=='pistolR';});lsSave();}}
secLoad();
if(totalEntries()===0)S.showRestore=true;
render();
})();
</script>
</body>
